<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お店の近さマップ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#25354a;background:#f5f7fa}.app{display:flex;height:100dvh}#map{flex:1;min-width:0}.panel{width:370px;background:white;padding:18px;overflow:auto}h1{font-size:22px;margin:0 0 8px}p{color:#69788c;font-size:13px;line-height:1.6}.row{display:flex;gap:8px;margin:10px 0}input[type=text],select{width:100%;padding:11px;border:1px solid #d3dce8;border-radius:8px;font-size:15px}button{background:#2674d8;color:white;border:0;border-radius:8px;padding:11px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.brands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.brands label{padding:10px;border:1px solid #d3dce8;border-radius:8px;font-size:13px}.brands label:has(input:checked){background:#e9f3ff}h3{font-size:14px;margin:18px 0 7px}.status{padding:12px;background:#eaf2fc;border-radius:8px;font-size:13px;line-height:1.5}.item{padding:12px 0;border-bottom:1px solid #e8edf2}.good{color:#14804a}.bad{color:#b45d2a}.summary{font-weight:bold;padding:12px;background:#edf8f1;border-radius:8px;margin-top:10px}.note{font-size:11px;color:#738093}@media(max-width:750px){.app{flex-direction:column}#map{flex:none;height:45dvh}.panel{width:100%;height:55dvh;padding:15px}}</style></head><body><div class="app"><div id="map"></div><main class="panel"><h1>📍 お店の近さマップ</h1><p>引っ越し候補地から、各チェーン店までの直線距離を調べます。地図をタップして地点を指定してください。</p><h3>地名検索</h3><div class="row"><input id="q" type="text" placeholder="例：町田駅、横浜駅"><button id="move">移動</button></div><h3>調べるブランド</h3><div id="brands" class="brands"></div><h3>近いと判定する距離</h3><select id="radius"><option value="500">500m</option><option value="1000" selected>1km</option><option value="2000">2km</option><option value="3000">3km</option><option value="5000">5km</option></select><h3>店舗検索</h3><button id="load" style="width:100%">表示エリアの店舗を読み込む</button><p>地図を駅周辺まで拡大してから押してください。</p><div id="status" class="status">地図を表示しています。</div><div id="summary" class="summary" hidden></div><div id="results"></div><p class="note">地図・店舗データ：© OpenStreetMap contributors。距離は直線距離です。店舗情報は不完全な場合があります。店舗データは定期更新されます。更新失敗時は前回のデータを利用します。</p></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const $=id=>document.getElementById(id),defs=[['uniqlo','ユニクロ'],['gu','GU'],['daiso','ダイソー'],['muji','無印良品'],['nitori','ニトリ'],['gyomu','業務スーパー'],['donki','ドン・キホーテ'],['starbucks','スターバックス']];let chosen=new Set(['uniqlo','gu','daiso','muji']),stores=[],point=null,pin=null,drawn=[],bounds=null;function msg(s){$('status').textContent=s}for(const [id,name] of defs){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=chosen.has(id);c.onchange=()=>{c.checked?chosen.add(id):chosen.delete(id);render()};l.append(c,document.createTextNode(name));$('brands').append(l)}if(!window.L){msg('地図ライブラリが読み込めません。');return}const map=L.map('map').setView([35.542,139.445],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);setTimeout(()=>map.invalidateSize(),300);function dist(a,b){const r=Math.PI/180,d=(b.lat-a.lat)*r,e=(b.lon-a.lng)*r,h=Math.sin(d/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(e/2)**2;return 12742000*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}const fmt=m=>m<1000?Math.round(m)+'m':(m/1000).toFixed(2)+'km';function render(){drawn.forEach(x=>map.removeLayer(x));drawn=[];$('results').replaceChildren();$('summary').hidden=true;if(!point)return;const radius=+$('radius').value;drawn.push(L.circle(point,{radius,color:'#2879da',fillOpacity:.06}).addTo(map));let ok=0;for(const [id,name] of defs){if(!chosen.has(id))continue;const nearest=stores.filter(s=>s.brand===id).map(s=>({...s,d:dist(point,s)})).sort((a,b)=>a.d-b.d)[0];if(nearest&&nearest.d<=radius)ok++;const item=document.createElement('div');item.className='item';const title=document.createElement('strong');title.textContent=name;const val=document.createElement('b');val.className=nearest&&nearest.d<=radius?'good':'bad';val.textContent=nearest?fmt(nearest.d):'未取得';const detail=document.createElement('small');detail.style.display='block';detail.textContent=nearest?nearest.name+'（直線距離）':'取得範囲内に登録なし';item.append(title,'　',val,detail);$('results').append(item);if(nearest){drawn.push(L.circleMarker([nearest.lat,nearest.lon],{radius:7,color:'#fff',fillColor:'#ed7739',fillOpacity:1}).bindPopup(name+' '+fmt(nearest.d)).addTo(map));drawn.push(L.polyline([point,[nearest.lat,nearest.lon]],{color:'#ed7739',dashArray:'5 5'}).addTo(map))}}$('summary').hidden=false;$('summary').textContent=chosen.size+'ブランド中 '+ok+'ブランドが'+fmt(radius)+'以内';if(bounds&&!bounds.contains(point))msg('店舗検索範囲の外です。再検索してください。')}map.on('click',e=>{point=e.latlng;if(pin)map.removeLayer(pin);pin=L.marker(point).addTo(map);render()});$('radius').onchange=render;$('move').onclick=async()=>{const q=$('q').value.trim();if(!q)return;msg('地名を検索中…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q='+encodeURIComponent(q));if(!r.ok)throw Error('HTTP '+r.status);const a=await r.json();if(!a.length)throw Error('地名が見つかりません');map.setView([+a[0].lat,+a[0].lon],14);msg('移動しました。店舗を読み込んでください。')}catch(e){msg('地名検索失敗：'+e.message)}};$('q').onkeydown=e=>{if(e.key==='Enter')$('move').click()};$('load').onclick=async()=>{if(map.getZoom()<13){msg('ズーム13以上まで拡大してください。');return}if(!chosen.size){msg('ブランドを選択してください。');return}const b=map.getBounds(),p=new URLSearchParams({south:b.getSouth(),west:b.getWest(),north:b.getNorth(),east:b.getEast(),brands:[...chosen].join(',')});$('load').disabled=true;msg('保存済み店舗データを読み込み中…');const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),26000);try{const r=await fetch('/data/stores.json',{signal:ctrl.signal,cache:'no-cache'}),data=await r.json();if(!r.ok)throw Error('保存済み店舗データを取得できません（HTTP '+r.status+'）');if(!data.updatedAt)throw Error('店舗データは初回取得待ちです。GitHub Actionsの更新処理を実行してください。');stores=(data.stores||[]).filter(s=>chosen.has(s.brand)&&b.contains([s.lat,s.lon]));bounds=b;msg(stores.length+'件の店舗を保存済みデータから取得しました（更新日：'+new Date(data.updatedAt).toLocaleDateString('ja-JP')+'）。地図をタップしてください。');render()}catch(e){msg('店舗検索失敗：'+(e.name==='AbortError'?'タイムアウト':e.message))}finally{clearTimeout(timer);$('load').disabled=false}}})();
</script></body></html>
